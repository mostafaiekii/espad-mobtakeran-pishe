appId: ir.spad.desktop
productName: Spad
copyright: Copyright © 2026 اسپاد مبتکران پیشه · Mostafa Morovati

directories:
  output: dist
  buildResources: build

# کپی node_modules موتور به مرحلهٔ بسته‌بندی (electron-builder آن را فیلتر می‌کند)
afterPack: ./afterpack.js

files:
  - main.js
  - package.json

extraResources:
  - from: resources/app
    to: app

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico

nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: اسپاد مبتکران پیشه
  artifactName: Spad-Setup-${version}.${ext}
  deleteAppDataOnUninstall: false
  # قوانین فایروال (installer.nsh): بازکردن پورت سرور برای اتصال سیستم‌های نیروها در LAN
  include: build/installer.nsh
