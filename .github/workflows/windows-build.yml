# ساخت نسخه ویندوز کارگاه‌یار (exe) روی رانر ویندوز گیت‌هاب
# خروجی: Release با فایل Kargahyar-Setup-<version>.exe

name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install

      - name: Prisma generate (native + windows)
        run: bunx prisma generate

      - name: Create seed database
        shell: bash
        run: |
          mkdir -p db
          bunx prisma db push --accept-data-loss
          bun prisma/seed.ts
        env:
          # مسیر نسبت به prisma/schema.prisma حل می‌شود → ریشه پروژه
          DATABASE_URL: file:../db/demo.db

      - name: Build Next.js standalone
        shell: bash
        run: bun run build
        env:
          DATABASE_URL: file:../db/demo.db

      # مونتاژ قطعی موتور: standalone + node_modules با npm + کلاینت Prisma و موتور ویندوز
      - name: Assemble Electron resources
        shell: bash
        run: node scripts/assemble-desktop.js
        env:
          DATABASE_URL: file:../db/demo.db

      - name: Verify packaged engine (fail loudly)
        shell: bash
        run: |
          set -e
          test -f desktop/resources/app/server.js
          test -f desktop/resources/app/node_modules/next/package.json
          test -f desktop/resources/app/node_modules/react/index.js
          test -f desktop/resources/app/node_modules/react-dom/index.js
          test -f desktop/resources/app/node_modules/@prisma/client/package.json
          test -f desktop/resources/app/node_modules/.prisma/client/index.js
          test -f desktop/resources/app/node_modules/.prisma/client/schema.prisma
          ls desktop/resources/app/node_modules/.prisma/client/query_engine-windows*.node > /dev/null
          test -d desktop/resources/app/.next/static
          test -d desktop/resources/app/public
          test -f desktop/resources/seed/kargahyar.db
          echo "OK: all critical engine files present"

      - name: Install Electron toolchain
        run: npm install --no-audit --no-fund
        working-directory: desktop

      - name: Build Windows installer
        run: npx electron-builder --win nsis --x64
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kargahyar-Setup
          path: desktop/dist/*.exe
