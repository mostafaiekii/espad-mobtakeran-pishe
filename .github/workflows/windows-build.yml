# ساخت نسخه ویندوز کارگاه‌یار (exe) روی رانر ویندوز گیت‌هاب
# خروجی: desktop/dist/Kargahyar-Setup-1.0.0.exe در آرتیفکت‌های اکشن

name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Prisma generate (native + windows)
        run: bunx prisma generate

      - name: Create seed database
        shell: bash
        run: |
          mkdir -p db
          bunx prisma db push --accept-data-loss
          bun prisma/seed.ts
        env:
          # مسیر نسبت به prisma/schema.prisma حل می‌شود → ریشه پروژه
          DATABASE_URL: file:../db/demo.db

      - name: Build Next.js standalone
        shell: bash
        run: bun run build
        env:
          DATABASE_URL: file:../db/demo.db

      - name: Assemble Electron resources
        shell: bash
        run: |
          mkdir -p desktop/resources/seed
          cp -r .next/standalone desktop/resources/app
          cp -r .next/static desktop/resources/app/.next/static
          cp -r public desktop/resources/app/public
          cp node_modules/.prisma/client/query_engine-windows*.dll.node desktop/resources/app/node_modules/.prisma/client/ || true
          cp node_modules/.prisma/client/schema.prisma desktop/resources/app/node_modules/.prisma/client/
          cp db/demo.db desktop/resources/seed/kargahyar.db
          # تبدیل symlinkها به کپی واقعی (سازگاری NSIS)
          cd desktop/resources/app
          for l in $(find . -type l); do
            t=$(readlink -f "$l") || continue
            rm -f "$l"
            cp -rL "$t" "$l" || true
          done
          cd ../../../..

      - name: Install Electron toolchain
        run: npm install --no-audit --no-fund
        working-directory: desktop

      - name: Build Windows installer
        run: npx electron-builder --win nsis --x64
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kargahyar-Setup
          path: desktop/dist/*.exe
